<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shayona Catering Order</title>
<meta name="description" content="Order catering from BAPS Minneapolis Shayona. Pure vegetarian, no onion, no garlic.">
<link rel="icon" type="image/png" href="logo.png">
<style>
  html,body{margin:0;height:100%;background:#f6f7fb;font-family:Arial,Helvetica,sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#2e3092}
  #loading img{height:70px}
</style>
</head>
<body>
<div id="loading"><img src="logo.png" alt="BAPS Shayona"><div>Loading catering order…</div></div>
<iframe id="app" title="Shayona Catering Order" allow="clipboard-write"></iframe>
<script>
  // ▼▼▼ Paste your Google Apps Script /exec link here ▼▼▼
  var EXEC_URL = 'https://script.google.com/macros/s/PASTE-YOUR-ID-HERE/exec';
  // ▲▲▲ ------------------------------------------------ ▲▲▲

  // Pass ?action=confirm / ?action=edit (from the email buttons) through to the order tool.
  var f = document.getElementById('app');
  f.addEventListener('load', function () { document.getElementById('loading').style.display = 'none'; });
  f.src = EXEC_URL + (location.search || '');
</script>
</body>
</html>
